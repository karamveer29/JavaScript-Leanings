<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Formatter</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <div class="input-container">
      <h1>Type in your words</h1>
      <input type="text" id="input-field" placeholder="Type your text here" />
    </div>

    <div class="btns-container">
      <button class="btn" id="uppercase">ABC</button>
      <button class="btn" id="lowercase">abc</button>
      <button class="btn" id="capitalize">Abc</button>
      <button class="btn" id="bold">B</button>
      <button class="btn" id="italic">/</button>
      <button class="btn" id="underline">ABC</button>
    </div>

    <p id="output-field">Output</p>
  </div>

  <script src="code.js"></script>
</body>
</html>
