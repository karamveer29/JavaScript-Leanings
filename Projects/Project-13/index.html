<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FunBox Text & Jokes</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <header>
        <h1>FunBox</h1>
        <p>Play with Text and Laugh with Jokes!</p>
    </header>
    <main>
        <!-- Text Formatter section -->
         <section class="card">
            <h2>Text Formatter</h2>
            <input type="text" id="text-input" placeholder="Type your name here..."/>
            <div class="button">
                <button id="upper">UPPERCASE</button>
                <button id="lower">LOWERCASE</button>
                <button id="capitalize">CAPITALIZE</button>
                <button id="bold">BOLD</button>
                <button id="italic">ITALIC</button>
                <button id="underline">UNDERLINE</button>
            </div>
            <p id="text-output">Your formatted text will appear here</p>
         </section>

         <!-- Joke genertor section -->
          <section class="card">
            <h2>😂 Joke Generator</h2>
            <p id="joke-output">Click below to get random joke!</p>
            <button id="joke-btn">Get Joke</button>
          </section>
    </main>
    <footer>
        <p>->Made ❤️ with Karamveer-></p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
